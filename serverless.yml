service: vyva
frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  memorySize: ${ssm:/vyva/${self:provider.stage}/VYVA_LAMBDA_MEMORYSIZE}
  timeout: 30
  stage: ${opt:stage,'dev'}
  region: us-east-1
  apiGateway:
    shouldStartNameWithService: true
  deploymentBucket:
    name: vyva-deployment-bucket
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:CreateTable
            - dynamodb:DescribeTable
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:TransactWrite
            - dynamodb:TransactRead
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:754881596744:table/${self:provider.stage}-vyva-*
            - arn:aws:dynamodb:${self:provider.region}:754881596744:table/${self:provider.stage}-vyva-*/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:provider.stage}-vyva-files
            - arn:aws:s3:::${self:provider.stage}-vyva-files/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::vyva-deployment-bucket
            - arn:aws:s3:::vyva-deployment-bucket/*
        - Effect: Allow
          Action:
            - ssm:GetParameter
            - ssm:GetParameters
            - ssm:GetParametersByPath
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/vyva/${self:provider.stage}/*

package:
  excludeDevDependencies: true
  patterns:
    - '!**'
    - 'dist/**'
# custom:
#   stages:
#     - qas
#     - prd
functions:
  api:
    handler: dist/lambda.handler
    events:
      - http:
          path: /
          method: ANY
      - http:
          path: /{proxy+}
          method: ANY
    layers:
      - arn:aws:lambda:us-east-1:754881596744:layer:vyva-auth:1
    environment:
      NODE_ENV: ${self:provider.stage}
      PORT: 3000
      ERROR_LOGS: true

      # Auth Configuration
      JWT_SECRET: ${ssm:/vyva/${self:provider.stage}/VYVA_JWT_SECRET}
      SECRET_KEY: ${ssm:/vyva/${self:provider.stage}/VYVA_SECRET_KEY}

      # Admin Configuration
      ADMIN_PHONE: ${ssm:/vyva/${self:provider.stage}/VYVA_ADMIN_PHONE}
      ADMIN_EMAIL: ${ssm:/vyva/${self:provider.stage}/VYVA_ADMIN_EMAIL}

      # Email/SMTP Configuration
      IAM_SMTP: ${ssm:/vyva/${self:provider.stage}/VYVA_IAM_SMTP}
      SMTP_HOST: ${ssm:/vyva/${self:provider.stage}/VYVA_SMTP_HOST}
      SMTP_USER: ${ssm:/vyva/${self:provider.stage}/VYVA_SMTP_USER}
      SMTP_PASSWORD: ${ssm:/vyva/${self:provider.stage}/VYVA_SMTP_PASSWORD}
      EMAIL_SENDER: ${ssm:/vyva/${self:provider.stage}/VYVA_EMAIL_SENDER}

      # AWS Configuration
      ACCESS_KEY_ID: ${ssm:/vyva/${self:provider.stage}/VYVA_ACCESS_KEY_ID}
      SECRET_ACCESS_KEY: ${ssm:/vyva/${self:provider.stage}/VYVA_SECRET_ACCESS_KEY}
      REGION: ${ssm:/vyva/${self:provider.stage}/VYVA_REGION}

      # Google OAuth Configuration
      GOOGLE_CLIENT_ID: ${ssm:/vyva/${self:provider.stage}/VYVA_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${ssm:/vyva/${self:provider.stage}/VYVA_GOOGLE_CLIENT_SECRET}
      GOOGLE_CALENDAR_REDIRECT_URI: ${ssm:/vyva/${self:provider.stage}/VYVA_GOOGLE_CALENDAR_REDIRECT_URI}
      FRONTEND_URL: ${ssm:/vyva/${self:provider.stage}/VYVA_FRONTEND_URL}

      # S3 Configuration
      S3_BUCKET_NAME: ${ssm:/vyva/${self:provider.stage}/VYVA_S3_BUCKET_NAME}
resources:
  Resources:
    # Bucket ya existe, comentado para evitar conflictos
    # VyvaFilesBucket:
    #   Type: AWS::S3::Bucket
    #   DeletionPolicy: Retain
    #   Properties:
    #     BucketName: ${self:provider.stage}-vyva-files
    #     PublicAccessBlockConfiguration:
    #       BlockPublicAcls: true
    #       BlockPublicPolicy: true
    #       IgnorePublicAcls: true
    #       RestrictPublicBuckets: true
    #     CorsConfiguration:
    #       CorsRules:
    #         - AllowedHeaders:
    #             - '*'
    #           AllowedMethods:
    #             - GET
    #             - PUT
    #             - POST
    #             - DELETE
    #           AllowedOrigins:
    #             - '*'
    #           MaxAge: 3000
plugins:
  - serverless-deployment-bucket
  - serverless-stage-manager
  - serverless-plugin-utils
