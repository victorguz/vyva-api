name: Deploy to AWS

on:
  push:
    branches:
      - qas # Despliega a QAS
      - prd # Despliega a PRD
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy (qas or prd)'
        required: true
        type: choice
        options:
          - qas
          - prd

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@victorguz'

      - name: Configure npm for GitHub Packages
        run: |
          echo "@victorguz:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build
        run: npm run build

      - name: Determine stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> $GITHUB_OUTPUT
          else
            echo "stage=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_IAM_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_IAM_SECRET }}
          aws-region: us-east-1

      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Deploy to AWS
        run: |
          serverless deploy --stage ${{ steps.stage.outputs.stage }} --verbose

      - name: Deployment summary
        run: |
          echo "✅ Desplegado exitosamente a: ${{ steps.stage.outputs.stage }}"
          echo "   Stack: vyva-${{ steps.stage.outputs.stage }}"
